# Este archivo debe ir dentro de una carpeta llamada .streamlit
# es decir, la ruta en tu repo debe ser:  .streamlit/config.toml

[theme]
primaryColor = "#4C78A8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
# Tamaño máximo de archivo que se puede subir (en MB).
# Nota: en Community Cloud la memoria disponible es limitada (~1 GB),
# así que subir archivos muy grandes puede agotar la memoria de la app.
maxUploadSize = 200
